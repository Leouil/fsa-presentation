name: Build & Deploy Presentation

on:
  push:
    branches: [main]
    paths:
      - 'presentation-src/**'
      - 'homework-instructions/**'
      - 'homework-config/**'
  workflow_dispatch:
    inputs:
      homework:
        description: 'Homework number (e.g. 01, 02)'
        required: true
        default: '01'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: presentation-src/package-lock.json

      - name: Install dependencies
        working-directory: ./presentation-src
        run: npm ci

      - name: Build presentation
        working-directory: ./presentation-src
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './presentation-src/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
